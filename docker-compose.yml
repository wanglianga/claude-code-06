services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: family-theater-lost-child:latest
    container_name: ${COMPOSE_PROJECT_NAME}-app
    # 仅发布应用服务端口，宿主机端口由 CC_PUBLISH_PORT 指定（避免并行任务冲突）
    ports:
      - "${CC_PUBLISH_PORT}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 8s
