server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # 健康检查端点
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
